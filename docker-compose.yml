services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      # креды берутся из .env в корне проекта (см. .env.example)
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379
      - VALHALLA_URL=http://valhalla:8002
      # зона тайлов valhalla ниже ([south, west, north, east], пусто = весь
      # мир). Источник правды — scripts/valhalla_regions.txt; после правки
      # регионов скрипт update_valhalla_tiles.sh печатает нужную строку
      - ROUTING_COVERAGE=[[54.30,19.60,55.35,23.05],[55.35,36.95,56.05,38.15]]
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      - postgres
      - redis
      - valhalla
    env_file:
      - ./backend/.env

  # ТЗ-Meili M5.3: фоновая работа ассистента (суммаризация истории).
  # Интерактивный диалог живёт в backend (SSE в запросе), фон — здесь.
  worker:
    build: ./backend
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379
      - VALHALLA_URL=http://valhalla:8002
      - ROUTING_COVERAGE=[[54.30,19.60,55.35,23.05],[55.35,36.95,56.05,38.15]]
    volumes:
      - ./backend:/app
    depends_on:
      - postgres
      - redis
    env_file:
      - ./backend/.env

  postgres:
    image: postgis/postgis:15-3.3-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
  valhalla:
    # версия зафиксирована: latest застрял на 3.7.0, где пешеходные маршруты
    # по Москве падали 500 «GetTags: offset exceeds size of text list»
    # (valhalla#6288, исправлено в 3.9.0). Тот же образ собирает тайлы —
    # см. scripts/update_valhalla_tiles.sh
    image: ghcr.io/valhalla/valhalla-scripted:3.9.0
    restart: unless-stopped
    ports:
      - "8002:8002"
    volumes:
      - ./valhalla_data:/custom_files
  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    profiles: ["tools"]
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL:-admin@admin.com}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres

volumes:
  postgres_data:
  pgadmin_data: